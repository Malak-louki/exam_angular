<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo / Brand -->
      <a routerLink="/" class="text-2xl font-bold text-blue-600 hover:text-blue-700">
        📸 PictureApp
      </a>

      <!-- Navigation Links -->
      <div class="flex items-center gap-6">
        <a 
          routerLink="/feed" 
          routerLinkActive="text-blue-600 font-semibold"
          class="text-gray-700 hover:text-blue-600 transition-colors"
        >
          Feed
        </a>

        @if (currentUser()) {
          <!-- Authenticated User Menu -->
          <a 
            routerLink="/create" 
            routerLinkActive="text-blue-600 font-semibold"
            class="flex items-center gap-2 text-gray-700 hover:text-blue-600 transition-colors"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Créer
          </a>

          <a 
            [routerLink]="['/user', currentUser()!.id, 'pictures']"
            routerLinkActive="text-blue-600 font-semibold"
            class="flex items-center gap-2 text-gray-700 hover:text-blue-600 transition-colors"
          >
            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold text-sm">
              {{ currentUser()!.displayName.charAt(0).toUpperCase() }}
            </div>
            <span>{{ currentUser()!.displayName }}</span>
          </a>

          <button 
            (click)="logout()"
            class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
          >
            Déconnexion
          </button>
        } @else {
          <!-- Guest Menu -->
          <a 
            routerLink="/login" 
            routerLinkActive="text-blue-600 font-semibold"
            class="text-gray-700 hover:text-blue-600 transition-colors"
          >
            Connexion
          </a>
          <a 
            routerLink="/register"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
          >
            Inscription
          </a>
        }
      </div>
    </div>
  </div>
</nav>
