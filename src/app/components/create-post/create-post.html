<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-3xl font-bold mb-6">Créer un nouveau post</h1>

    @if (!currentUser()) {
      <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
        <p class="text-yellow-800">
          Vous devez être 
          <a routerLink="/login" class="text-blue-600 hover:underline font-semibold">connecté</a> 
          pour poster une image.
        </p>
      </div>
    } @else {
      <form (ngSubmit)="submitPost()" class="space-y-6">
        <!-- File Upload Area -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Image *
          </label>
          
          @if (!previewUrl()) {
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors cursor-pointer">
              <input
                type="file"
                accept="image/*"
                (change)="onFileSelected($event)"
                class="hidden"
                #fileInput
              />
              <button
                type="button"
                (click)="fileInput.click()"
                class="inline-flex flex-col items-center"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <span class="text-sm text-gray-600">
                  Cliquez pour sélectionner une image
                </span>
                <span class="text-xs text-gray-500 mt-1">
                  PNG, JPG, GIF jusqu'à 10MB
                </span>
              </button>
            </div>
          } @else {
            <div class="relative">
              <img 
                [src]="previewUrl()" 
                alt="Preview" 
                class="w-full h-auto rounded-lg shadow-md"
              />
              <button
                type="button"
                (click)="removeFile()"
                class="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-full hover:bg-red-700 transition-colors"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
              </button>
            </div>
          }
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
            Description (optionnelle)
          </label>
          <textarea
            id="description"
            [(ngModel)]="description"
            name="description"
            rows="4"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
            placeholder="Ajoutez une description à votre image..."
          ></textarea>
        </div>

        <!-- Error Message -->
        @if (error()) {
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <p class="text-red-800">{{ error() }}</p>
          </div>
        }

        <!-- Submit Buttons -->
        <div class="flex gap-4">
          <button
            type="submit"
            [disabled]="isUploading() || !selectedFile()"
            class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-semibold"
          >
            @if (isUploading()) {
              <span class="flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Publication en cours...
              </span>
            } @else {
              Publier
            }
          </button>

          <a
            routerLink="/feed"
            class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors font-semibold text-center"
          >
            Annuler
          </a>
        </div>
      </form>
    }
  </div>
</div>
