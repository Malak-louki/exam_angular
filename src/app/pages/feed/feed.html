<div class="container mx-auto px-4 py-8 bg-[#f8f7ff] rounded-2xl shadow-sm">
  <div class="mb-6">
    <h1 class="text-3xl font-semibold text-[#5e548e]">Feed</h1>
  </div>

  @if (postPage.isLoading()) {
    <!-- Loading -->
    <div class="flex justify-center items-center min-h-[300px]">
      <div class="relative">
        <div class="h-14 w-14 rounded-full border-2 border-[#cdb4db]/40"></div>
        <div class="absolute inset-0 h-14 w-14 rounded-full border-2 border-t-[#5e548e] animate-spin"></div>
      </div>
    </div>
  } @else {
    @if (postPage.hasValue() && postPage.value().totalElements > 0) {
      <!-- Content -->
      <div class="bg-white/80 border border-[#b8c0ff]/30 rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow">
        <hb-post-list [posts]="postPage.value().content" />

        <div class="mt-6 flex justify-center">
          <hb-pagination
            [page]="page()"
            [paginated]="postPage.value()"
            class="*[&_button]:bg-[#cdb4db]/40 *[&_button]:text-[#3c096c] *[&_button:hover]:bg-[#b8c0ff]/50 *[&_button]:rounded-lg *[&_button]:border *[&_button]:border-[#b8c0ff]/30"
          />
        </div>
      </div>
    } @else {
      <!-- Empty state -->
      <div class="text-center py-14 bg-white/70 border border-[#b8c0ff]/30 rounded-2xl shadow-sm">
        <div class="mx-auto mb-5 flex h-24 w-24 items-center justify-center rounded-2xl bg-[#cdb4db]/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-[#b8c0ff]" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-[#5e548e] mb-2">Aucune publication</h2>
        <p class="text-[#6d597a]">Revenez plus tard pour découvrir de nouvelles images.</p>
      </div>
    }
  }
</div>
