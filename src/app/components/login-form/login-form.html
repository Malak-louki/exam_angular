<div class="min-h-screen flex items-center justify-center bg-[#f8f7ff] px-4">
  <form
    [formGroup]="form"
    (ngSubmit)="handleSubmit()"
    class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-sm border border-[#b8c0ff]/40"
  >
    <!-- Titre -->
    <h1 class="text-3xl font-semibold text-[#5e548e] mb-6 text-center">
      Connexion
    </h1>

    <!-- Email -->
    <div class="mb-4">
      <label
        for="email"
        class="block text-[#6d597a] font-medium mb-1"
      >
        Email
      </label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="w-full px-4 py-2 rounded-lg border border-[#cdb4db]/60 focus:outline-none focus:ring-2 focus:ring-[#b8c0ff] transition"
        placeholder="exemple@email.com"
      />
      @if (form.get('email')?.invalid && form.get('email')?.touched) {
        <p class="text-sm text-red-500 mt-1">Email invalide</p>
      }
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label
        for="password"
        class="block text-[#6d597a] font-medium mb-1"
      >
        Mot de passe
      </label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full px-4 py-2 rounded-lg border border-[#cdb4db]/60 focus:outline-none focus:ring-2 focus:ring-[#b8c0ff] transition"
        placeholder="••••••••"
      />
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <p class="text-sm text-red-500 mt-1">Mot de passe requis</p>
      }
    </div>

    <!-- Bouton -->
    <button
      type="submit"
      [disabled]="form.invalid"
      class="w-full py-2 rounded-lg text-white font-medium bg-[#cdb4db] hover:bg-[#b8c0ff] disabled:opacity-50 disabled:cursor-not-allowed transition"
    >
      Se connecter
    </button>

    <!-- Debug -->
    <p class="text-center text-sm text-[#6d597a] mt-4">
      Formulaire valide : <span class="font-semibold">{{ form.valid }}</span>
    </p>
  </form>
</div>
