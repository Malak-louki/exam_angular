<div
    class="max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 overflow-hidden relative">
    <!-- Image avec le coeur en overlay -->
    <div class="relative">
        <img class="w-full h-48 object-cover" [src]="post().image" alt="image" />

        <!-- Bouton coeur -->
        <button type="button" (click)="toggleLike()"
            class="absolute top-2 right-2 p-2 rounded-full bg-white/70 hover:bg-white shadow-md transition">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                [ngClass]="liked ? 'text-red-600' : 'text-gray-400'" class="w-6 h-6 transition-colors duration-200">
                <path fill-rule="evenodd" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
               2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09 
               A6.36 6.36 0 0 1 16.5 3C19.58 3 22 5.42 22 8.5
               c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <!-- Contenu -->
    <div class="p-5">
        <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
            {{ post().title }}
        </h5>
        <a href="#" class="inline-flex items-center px-3 py-2 text-sm font-medium text-center text-white 
                bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none 
                focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
            Read more
            <svg class="rtl:rotate-180 w-3.5 h-3.5 ms-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 14 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M1 5h12m0 0L9 1m4 4L9 9" />
            </svg>
        </a>
    </div>
</div>
