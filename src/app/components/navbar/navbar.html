<nav class="sticky top-0 z-50 w-full backdrop-blur bg-[#f8f7ff]/80 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="h-16 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-2">
        <span class="text-3xl">📸</span>
        <a routerLink="/"
           class="text-[#5e548e] text-2xl font-semibold hover:text-[#b8c0ff] transition-colors"
           (click)="closeMenu()">
          PictureApp
        </a>
      </div>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-6">
        <a
          routerLink="/feed"
          routerLinkActive="text-[#5e548e] border-b-2 border-[#b8c0ff]"
          class="text-[#6d597a] hover:text-[#b8c0ff] transition-colors font-medium pb-0.5"
        >
          Feed
        </a>

        <a
          routerLink="/login"
          class="bg-[#cdb4db] text-[#3c096c] px-4 py-2 rounded-lg hover:bg-[#bde0fe] transition-colors"
        >
          Connexion
        </a>

        <a
          routerLink="/register"
          class="bg-[#b8c0ff] text-[#3c096c] px-4 py-2 rounded-lg font-semibold hover:bg-[#ffd6ff] transition-colors"
        >
          Inscription
        </a>
      </div>

      <!-- Mobile hamburger -->
      <button
        type="button"
        class="md:hidden inline-flex items-center justify-center p-2 rounded-lg border border-transparent hover:border-[#b8c0ff] focus:outline-none"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        (click)="toggleMenu()"
      >
        <span class="sr-only">Ouvrir le menu</span>
        <!-- Icon burger / close -->
        @if (!menuOpen()) {
          <svg class="h-6 w-6 text-[#5e548e]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg class="h-6 w-6 text-[#5e548e]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile panel -->
  @if (menuOpen()) {
    <div id="mobile-menu" class="md:hidden border-t border-[#b8c0ff]/30">
      <div class="px-4 pt-3 pb-4 space-y-3">
        <a routerLink="/feed"
           routerLinkActive="bg-[#ffd6ff]"
           class="block rounded-md px-3 py-2 text-[#6d597a] hover:bg-[#ffd6ff] transition-colors"
           (click)="closeMenu()">
          Feed
        </a>

        <a routerLink="/login"
           class="block rounded-md px-3 py-2 bg-[#cdb4db] text-[#3c096c] hover:bg-[#bde0fe] transition-colors"
           (click)="closeMenu()">
          Connexion
        </a>

        <a routerLink="/register"
           class="block rounded-md px-3 py-2 bg-[#b8c0ff] text-[#3c096c] font-semibold hover:bg-[#ffd6ff] transition-colors"
           (click)="closeMenu()">
          Inscription
        </a>
      </div>
    </div>
  }
</nav>
